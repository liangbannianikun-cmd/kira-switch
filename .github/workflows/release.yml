name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Audit dependencies
        run: npm audit
      - name: Run Electron render smoke test
        run: npm run smoke
      - name: Run Codex and DeepSeek Hermes injection smoke test
        run: npm run smoke:e2e
      - name: Build Windows packages
        run: npm run dist:win
      - name: Test packaged application
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          node test/packaged-smoke.js "dist/win-unpacked/Kira Switch.exe"
          node test/packaged-smoke.js "dist/Kira-Switch-$version-Windows-Portable.exe"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kira-Switch-Windows-x64
          path: |
            dist/Kira-Switch-*-Windows-Portable.exe
            dist/Kira-Switch-*-x64.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = Get-ChildItem dist -File | Where-Object { $_.Name -match '^Kira-Switch-.+-(Windows-Portable\.exe|x64\.zip)$' } | Select-Object -ExpandProperty FullName
          gh release create "$env:GITHUB_REF_NAME" $assets `
            --title "Kira Switch ${{ github.ref_name }}" `
            --generate-notes
