name: Bug report / 问题反馈
description: Report a reproducible Kira Switch problem without including private character data.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Remove API keys, account information, private character cards, and personal file paths before submitting.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前确认
      options:
        - label: I searched existing issues. / 我已搜索已有 Issue。
          required: true
        - label: I removed credentials and private data. / 我已删除凭据与隐私数据。
          required: true
  - type: input
    id: version
    attributes:
      label: Version / 版本
      placeholder: "1.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows and target client / Windows 与目标客户端
      placeholder: "Windows 11 24H2, Codex"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots / 已脱敏日志或截图
      description: Remove character prompts, account names, private paths, and credentials.
